name: Daily Conversation Digest

on:
  schedule:
    - cron: '0 14 * * *'  # 9 AM ET (UTC-5) — adjust if needed
  workflow_dispatch:       # Allows manual trigger from GitHub Actions tab

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Send daily digest email
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            https://archpointlabs.com/api/send-digest \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          echo "Response status: $response"
          if [ "$response" != "200" ]; then
            echo "Digest request failed with status $response"
            exit 1
          fi
